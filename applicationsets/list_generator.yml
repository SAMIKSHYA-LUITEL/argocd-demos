apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-list
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - app: nginx
            path: ui_approach/nginx
          - app: online-shop
            path: multicluster/online-shop
          - app: chai-app
            path: applicationsets/chai-app
          - app: apache
            path: cli_approach/apache
  template:
    metadata:
      name: '{{app}}-list'
    spec:
      project: default
      source:
        repoURL: https://github.com/SAMIKSHYA-LUITEL/argocd-demos.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{app}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
