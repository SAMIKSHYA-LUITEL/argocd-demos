apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chai-app
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-health-degraded.email: "samikshyaluitel5@gmail.com"
    notifications.argoproj.io/subscribe.on-deployed.email: "samikshyaluitel5@gmail.com"
spec:
    project: default
    source:
      repoURL: https://github.com/SAMIKSHYA-LUITEL/argocd-demos.git
      targetRevision: main
      path: applicationsets/chai-app
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

