apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: online-shop-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SAMIKSHYA-LUITEL/argocd-demos.git
    targetRevision: main
    path: multicluster/online-shop
  destination: 
    name: prod-cluster
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
